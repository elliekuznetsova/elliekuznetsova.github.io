/* colors used only by the graph */
:root{--fg:#1c1c1c;--muted:#6b6b6b;--link:#1a63c7;--line:#dcdcdc;--panel:#fff;--edge:0,0,0}
main{flex:1;min-width:0}
nav{display:flex;flex-wrap:wrap;gap:6px 24px;margin-bottom:26px}
nav a[aria-current]{font-weight:700}

.stage{position:relative;height:max(540px,calc(100vh - 250px));margin-top:8px}
svg#g{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.node{cursor:pointer;transition:opacity .2s}
.node:focus-visible{outline:none;stroke:var(--fg);stroke-width:2.5}
.link{stroke:rgb(var(--edge));transition:opacity .2s}
#legend{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:.98rem;padding:2px 10px 2px 4px;border-radius:99px;border:1px solid transparent;background:transparent}
#legend button:hover{border-color:var(--line)}
#legend button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#legend button[aria-pressed="false"]{opacity:.45}
#legend i{width:13px;height:13px;border-radius:50%;display:block}
#legend small{color:var(--muted)}
#card{position:absolute;z-index:3;display:none;min-width:180px;max-width:250px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-align:center;font-size:.95rem;line-height:1.4}
#card b{display:block;font:700 1rem/1.3 Merriweather,Georgia,serif;margin-bottom:2px}
#card a{word-break:break-all}
#card .av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font:700 1rem Merriweather,Georgia,serif;color:var(--panel)}
#card .grp{display:block;color:var(--muted);margin-top:3px}
@media (max-width:760px){.stage{height:480px}}

<script>
// ---- EDIT HERE: add groups, people, and cross-group links ----
const GROUPS = {
  ucsd:   {label: "UC San Diego",  color: "#c69214"},
  nau:    {label: "NAU",           color: "#fac01a"},
  dliflc: {label: "DLIFLC",        color: "#2e9e4f"},
  edusa:  {label: "Education USA", color: "#d93a3a"},
  tesol:  {label: "TESOL",         color: "#1a63c7"},
  world:  {label: "Worldwide",     color: "#8a4fd0"},
  sd:     {label: "San Diego",     color: "#1c1c1c"}
};
const PEOPLE = [
  {name:"Jeda Krisnell Dionisio", url:"https://www.ocf.berkeley.edu/~jedakrisnell/about/", group:"ucsd"},
  {name:"Taggert Smith", url:"https://taggert.com/", group:"ucsd"},
  {name:"Ella Bartt", url:"https://ellabartt.com/", group:"ucsd"},
  {name:"Oishani Bandopadhyay", url:"https://oishani-b.github.io/", group:"ucsd"},
  {name:"Nissa Carter", url:"https://nissacarterportfolio.weebly.com/", group:"ucsd"},
  {name:"Annalisa Arcidiacono", url:"https://no.linkedin.com/in/annalisa-arcidiacono-37ab04233", group:"ucsd"},
  {name:"Aldan Creo", url:"https://acmc.fyi/", group:"ucsd"},
  {name:"Elizabeth Hanks", url:"https://hankselizabeth.wordpress.com/", group:"nau"},
  {name:"Dilara Dikilitaş", url:"https://www.linkedin.com/in/dilaradikilitas", group:"nau"},
  {name:"Kevin Hirschi", url:"https://www.kevinhirschi.com/", group:"nau"},
  {name:"Ekaterina Sudina", url:"https://ekaterinasudina.tilda.ws/", group:"nau"},
  {name:"Nur Yagmur Demir", url:"https://demirnuryagmur.wixsite.com/yagmurdemir", group:"nau"},
  {name:"Maria Kostromitina", url:"https://www.mariakostromitina.com/", group:"nau"},
  {name:"Rachael Sutherland", url:"https://www.linkedin.com/in/rachael-sutherland-77b44b352/", group:"nau"},
  {name:"Olga Klochkov", url:"https://www.linkedin.com/in/olga-klochkov-07421622b", group:"dliflc"},
  {name:"Maryna Kuziakina", url:"https://www.linkedin.com/in/maryna-k-40962568/", group:"dliflc"},
  {name:"Irina Petrovich", url:"https://www.linkedin.com/in/irina-petrovich-199b46110", group:"dliflc"},
  {name:"Boris Oskolkov", url:"https://borisoskolkov.github.io/", group:"edusa"},
  {name:"Pavel Koprov", url:"https://www.pkoprov.com/", group:"edusa"},
  {name:"Anna Iudintseva", url:"https://www.linkedin.com/in/anna-iudintseva", group:"edusa"},
  {name:"Sergey Rozhkov", url:"https://www.linkedin.com/in/sergei-rozhkov-a982331a9", group:"edusa"},
  {name:"Elena Krasilnikova", url:"https://www.linkedin.com/in/elena-krasilnikova-9255a27b/", group:"edusa"},
  {name:"Anastasiia Isaeva", url:"https://www.linkedin.com/in/anastasiia-isaevay", group:"edusa"},
  {name:"Talley Caruso", url:"https://www.linkedin.com/in/talley-caruso", group:"tesol"},
  {name:"Kristi Reyes", url:"https://www.linkedin.com/in/kristireyes", group:"tesol"},
  {name:"Amanda Simons", url:"https://www.linkedin.com/in/amandasimons", group:"tesol"},
  {name:"Burcu Chatham", url:"https://www.linkedin.com/in/burcu-chatham", group:"tesol"},
  {name:"Ying Suet Michelle Lung", url:"https://www.linkedin.com/in/ysmichellelung/", group:"tesol"},
  {name:"Grant Eckstein", url:"https://hum.byu.edu/directory/grant-eckstein", group:"tesol"},
  {name:"Kate Matthews", url:"https://www.linkedin.com/in/kate-matthews-9437b718a/", group:"tesol"},
  {name:"Gabriella Kazaku", url:"https://rs.linkedin.com/in/gabriella-kazaku", group:"world"},
  {name:"Lenara Vakkasova", url:"https://tavrida.art/races/letshkolashvartsmana/artshkolacomputeranimation", group:"world"},
  {name:"Elena Glukhova", url:"https://www.linkedin.com/in/elenaglukhovaital/", group:"world"},
  {name:"Magdalena Katańska", url:"https://www.linkedin.com/in/magdalena-katanska", group:"world"},
  {name:"Paul Anthony Romero", url:"https://www.linkedin.com/in/paul-anthony-romero-a988a6b/", group:"world"},
  {name:"Mariia Baranova", url:"https://www.linkedin.com/in/mariyabaranova", group:"sd"}
];
const EXTRA_LINKS = []; // e.g. ["Ella Bartt","Some Friend"] to connect across groups
// ---------------------------------------------------------------

const svg = d3.select("#g"), stage = document.querySelector(".stage"), card = document.getElementById("card"), legend = document.getElementById("legend");
const byName = new Map(PEOPLE.map(p => [p.name, p]));
const pairs = [];
PEOPLE.forEach((a,i) => PEOPLE.slice(i+1).forEach(b => { if (a.group === b.group) pairs.push([a.name, b.name]); }));
EXTRA_LINKS.forEach(([s,t]) => { if (byName.has(s) && byName.has(t)) pairs.push([s,t]); });
const deg = {}; pairs.forEach(([s,t]) => { deg[s] = (deg[s]||0)+1; deg[t] = (deg[t]||0)+1; });
const keys = Object.keys(GROUPS), active = new Set(keys);
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join("");

// 3D layout: springs between friends, repulsion between everyone, a pull toward each group's anchor
let seed = 7; const rnd = () => (seed = seed*16807 % 2147483647)/2147483647 - .5;
const nodes = PEOPLE.map(p => ({...p, id:p.name, r:7 + 1.6*(deg[p.name]||0), x:rnd()*2, y:rnd()*2, z:rnd()*2, vx:0, vy:0, vz:0, sp:(.4+(rnd()+.5)*1.2)*(rnd()>0?1:-1), tl:rnd()*2.4}));
const ix = new Map(nodes.map(n => [n.id, n]));
const links = pairs.map(([s,t]) => ({a:ix.get(s), b:ix.get(t)}));
const anchor = {}; keys.forEach((k,i) => { const t = 2*Math.PI*i/keys.length; anchor[k] = keys.length > 1 ? [Math.cos(t)*1.6, Math.sin(t)*.6, Math.sin(t)*1.6] : [0,0,0]; });
for (let it = 0; it < 500; it++) {
  nodes.forEach(a => {
    nodes.forEach(b => { if (a !== b) { const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z, f=.05/(dx*dx+dy*dy+dz*dz+.01); a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f; } });
    const c = anchor[a.group]; a.vx += (c[0]-a.x)*.01; a.vy += (c[1]-a.y)*.01; a.vz += (c[2]-a.z)*.01;
  });
  links.forEach(({a,b}) => { const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z, d=Math.hypot(dx,dy,dz)||1, f=(d-1.1)*.01/d;
    a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f; b.vx-=dx*f; b.vy-=dy*f; b.vz-=dz*f; });
  nodes.forEach(a => { a.x+=a.vx; a.y+=a.vy; a.z+=a.vz; a.vx*=.85; a.vy*=.85; a.vz*=.85; });
}
const M = Math.max(...nodes.map(n => Math.hypot(n.x,n.y,n.z))) || 1;
nodes.forEach(n => { n.x/=M; n.y/=M; n.z/=M; });

const rot = svg.append("g"), gl = rot.append("g"), gn = rot.append("g");
const link = gl.selectAll("line").data(links).join("line").attr("class","link");
const node = gn.selectAll("circle").data(nodes).join("circle")
  .attr("class","node").style("fill", d => GROUPS[d.group].color)
  .attr("tabindex",0).attr("role","link").attr("aria-label", d => d.name + ", " + GROUPS[d.group].label);

let angle = 0, hov = null, pinned = null, last = performance.now();
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(){
  const w = stage.clientWidth, h = stage.clientHeight, S = Math.min(w,h)*.4;
  const tilt = .4, ct = Math.cos(tilt), st = Math.sin(tilt);
  nodes.forEach(n => {
    // each node turns on its own axis and at its own speed
    const ca = Math.cos(angle*n.sp), sa = Math.sin(angle*n.sp), bx = n.x*Math.cos(n.tl) - n.y*Math.sin(n.tl), by = n.x*Math.sin(n.tl) + n.y*Math.cos(n.tl);
    const x1 = bx*ca + n.z*sa, z1 = -bx*sa + n.z*ca, y2 = by*ct - z1*st, z2 = by*st + z1*ct, k = 3/(3+z2*1.2);
    n.sx = w/2 + x1*S*k; n.sy = h/2 + y2*S*k; n.k = k;
  });
  link.attr("x1",d=>d.a.sx).attr("y1",d=>d.a.sy).attr("x2",d=>d.b.sx).attr("y2",d=>d.b.sy)
      .attr("stroke-opacity", d => hov && (d.a===hov || d.b===hov) ? .75 : 0);
  node.attr("cx",d=>d.sx).attr("cy",d=>d.sy).attr("r", d => d.r*d.k*(d===hov ? 1.35 : 1))
      .attr("fill-opacity", d => Math.max(.4, Math.min(1, (d.k-.5)*1.5)));
  node.sort((p,q) => p.k - q.k);
}
(function spin(t){
  const dt = Math.min((t-last)/1000, .1); last = t;
  if (!still && card.style.display !== "block") angle += dt*.14;
  draw(); requestAnimationFrame(spin);
})(last);

function showCard(d){
  const g = GROUPS[d.group];
  card.innerHTML = '<div class="av" style="background:'+g.color+'">'+initials(d.name)+'</div><b></b><a target="_blank" rel="noopener"></a><span class="grp"></span>';
  card.querySelector("b").textContent = d.name;
  const a = card.querySelector("a"); a.href = d.url; a.textContent = d.url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
  card.querySelector(".grp").textContent = g.label;
  card.style.display = "block";
  const W = stage.clientWidth, cw = card.offsetWidth, ch = card.offsetHeight, rr = d.r*d.k*1.35;
  card.style.left = Math.max(8, Math.min(W - cw - 8, d.sx - cw/2)) + "px";
  card.style.top = (d.sy - rr - ch - 10 < 8 ? d.sy + rr + 10 : d.sy - rr - ch - 10) + "px";
}
function hide(){ hov = null; pinned = null; card.style.display = "none"; }
node.on("mouseenter focus",(e,d)=>{ if(!pinned){ hov = d; showCard(d); } })
    .on("mouseleave blur",()=>{ if(!pinned){ hov = null; card.style.display = "none"; } })
    .on("click",(e,d)=>{ e.stopPropagation(); pinned = d; hov = d; showCard(d); })
    .on("keydown",(e,d)=>{ if(e.key==="Enter") window.open(d.url,"_blank","noopener"); });
svg.on("click", hide);
addEventListener("keydown", e => { if (e.key==="Escape") hide(); });

function applyFilter(){
  const on = d => active.has(d.group);
  node.style("opacity", d => on(d) ? 1 : .12);
  link.style("opacity", d => on(d.a) && on(d.b) ? 1 : .08);
}
keys.forEach(k => {
  const count = PEOPLE.filter(p => p.group === k).length;
  const b = document.createElement("button");
  b.setAttribute("aria-pressed","true");
  b.innerHTML = '<i style="background:'+GROUPS[k].color+'"></i><span></span><small>'+count+'</small>';
  b.querySelector("span").textContent = GROUPS[k].label;
  b.onclick = () => {
    if (active.size === keys.length) { active.clear(); active.add(k); }
    else if (active.has(k)) { active.delete(k); if(!active.size) keys.forEach(x=>active.add(x)); }
    else active.add(k);
    legend.querySelectorAll("button").forEach((bb,i)=>bb.setAttribute("aria-pressed", active.has(keys[i])));
    applyFilter();
  };
  legend.appendChild(b);
});
</script>
